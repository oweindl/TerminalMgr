name: Windows build
# Every push and pull request is built and tested. Only a push to main also creates a GitHub release.
# Feature branches and pull requests never release. The release tag is created by the workflow itself;
# tags are ignored here, so pushing the tag does not start a second run.
on:
  push:
    branches: ['**']
    tags-ignore: ['**']
  pull_request:
permissions:
  contents: write   # only the release step writes (tag and release)
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Secret scan of the whole history (gitleaks)
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'gitleaks'
          gh release download v8.30.1 --repo gitleaks/gitleaks --pattern '*windows_x64.zip' --dir $dir
          if ($LASTEXITCODE -ne 0) { throw 'gitleaks konnte nicht geladen werden.' }
          Expand-Archive (Join-Path $dir '*.zip') -DestinationPath $dir -Force
          & (Join-Path $dir 'gitleaks.exe') git --log-opts='--all' --redact --no-banner --exit-code 1 .
          if ($LASTEXITCODE -ne 0) { throw 'gitleaks hat ein mögliches Geheimnis gefunden.' }
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run bundle
        working-directory: web
      - run: dotnet build TerminalMgr.sln -c Release
      - run: dotnet run --project tests/TerminalMgr.Tests -c Release --no-build
      - run: dotnet run --project tests/TerminalMgr.UiTests -c Release --no-build
      - run: npm test
        working-directory: web
      - name: Publish (branches and pull requests, only to prove that it works)
        if: github.ref != 'refs/heads/main' || github.event_name != 'push'
        shell: pwsh
        run: |
          foreach ($arch in 'x64', 'arm64', 'x86') {
            dotnet publish src/TerminalMgr.App -c Release -r "win-$arch" --self-contained true -o "artifacts/TerminalMgr-win-$arch"
            if ($LASTEXITCODE -ne 0) { throw "dotnet publish für $arch ist fehlgeschlagen." }
          }
      - name: Release (push to main only)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Version: Major.Minor from Directory.Build.props, patch = run number of this workflow (for example 0.2.14).
          $majorMinor = @(([xml](Get-Content Directory.Build.props)).Project.PropertyGroup.MajorMinor) | Where-Object { $_ } | Select-Object -First 1
          if ($majorMinor -notmatch '^\d+\.\d+$') { throw "MajorMinor in Directory.Build.props ist ungültig: '$majorMinor'" }
          $version = "$majorMinor.${{ github.run_number }}"
          $tag = "v$version"
          gh release view $tag 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) { Write-Host "Release $tag existiert schon (erneuter Lauf); nichts zu tun."; $global:LASTEXITCODE = 0; return }
          $global:LASTEXITCODE = 0

          # One package per processor architecture, each with its own checksum file. The updater picks the one that matches the running program.
          $assets = @()
          foreach ($arch in 'x64', 'arm64', 'x86') {
            $out = "artifacts/TerminalMgr-win-$arch"
            dotnet publish src/TerminalMgr.App -c Release -r "win-$arch" --self-contained true "-p:Version=$version" -o $out
            if ($LASTEXITCODE -ne 0) { throw "dotnet publish für $arch ist fehlgeschlagen." }
            $zip = "artifacts/TerminalMgr-win-$arch-$version.zip"
            Compress-Archive -Path $out -DestinationPath $zip -CompressionLevel Optimal
            $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $(Split-Path $zip -Leaf)" | Set-Content "$zip.sha256" -Encoding ascii
            $assets += $zip, "$zip.sha256"
          }

          # Notes: the commit subjects since the previous release.
          $previous = (gh release list --limit 1 --json tagName --jq '.[0].tagName') 2>$null
          $range = if ($previous) { "$previous..HEAD" } else { 'HEAD' }
          $commits = @(git log $range --no-merges --pretty=format:'- %s')
          $download = @(
            '### Welche Datei brauche ich?',
            '',
            '| Ihr PC | Datei |',
            '|---|---|',
            "| Fast alle Windows-PCs (Intel oder AMD, 64 Bit) | ``TerminalMgr-win-x64-$version.zip`` |",
            "| PCs mit Snapdragon- oder anderem ARM-Prozessor (z. B. Surface Pro 11, Copilot+ PCs) | ``TerminalMgr-win-arm64-$version.zip`` |",
            "| Sehr alte 32-Bit-Windows-PCs | ``TerminalMgr-win-x86-$version.zip`` |",
            '',
            'Nicht sicher? Windows-Einstellungen › System › Info › „Systemtyp“ zeigt es an. Im Zweifel die x64-Datei nehmen.',
            '',
            '**Installieren in fünf Schritten:** [Anleitung für Einsteiger](https://github.com/oweindl/TerminalMgr#installation-für-einsteiger). Eine .NET-Installation ist nicht nötig; benötigt werden Windows OpenSSH und die Microsoft Edge WebView2 Runtime. Die Prüfsumme steht in der Datei .sha256 neben jedem Paket. Die App sucht beim Start selbst nach neuen Versionen und lädt das Paket für den eigenen Prozessor.',
            '')
          $notes = @("## TerminalMgr $version", '') + $download + @('### Änderungen', '') + $commits
          $notes | Set-Content notes.md -Encoding utf8
          $global:LASTEXITCODE = 0

          gh release create $tag @assets --title "TerminalMgr $version" --notes-file notes.md --target ${{ github.sha }}
          if ($LASTEXITCODE -ne 0) { throw 'Das Release konnte nicht angelegt werden.' }
      - uses: actions/upload-artifact@v4
        if: github.ref != 'refs/heads/main' || github.event_name != 'push'
        with:
          name: TerminalMgr-win-x64
          path: artifacts/TerminalMgr-win-x64/
