name: Windows build
on: [push, pull_request]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run bundle
        working-directory: web
      - run: dotnet build TerminalMgr.sln -c Release
      - run: dotnet run --project tests/TerminalMgr.Tests -c Release --no-build
      - run: npm test
        working-directory: web
      - run: dotnet publish src/TerminalMgr.App -c Release -r win-x64 --self-contained true -o artifacts/TerminalMgr-win-x64
      - uses: actions/upload-artifact@v4
        with:
          name: TerminalMgr-win-x64
          path: artifacts/TerminalMgr-win-x64/
